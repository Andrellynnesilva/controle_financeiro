<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Controle Financeiro</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #eef1f5;
      --card: #fff;
      --ink: #14213d;
      --mut: #6b7691;
      --line: #e1e6ee;
      --in: #0f9d74;
      --out: #e5484d;
      --acc: #2f4bff;
      --r: 16px
    }

    @media(prefers-color-scheme:dark) {
      :root {
        --bg: #0d1220;
        --card: #161d30;
        --ink: #eaf0ff;
        --mut: #8f9bb8;
        --line: #263050;
        --acc: #6b82ff
      }
    }

    * {
      box-sizing: border-box;
      margin: 0
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      padding: 24px 16px 48px
    }

    .wrap {
      max-width: 1080px;
      margin: auto
    }

    header {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -.02em
    }

    h2 {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 14px
    }

    .tools {
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    input,
    select,
    button {
      font: inherit;
      color: inherit
    }

    input,
    select {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      width: 100%
    }

    input:focus,
    select:focus,
    button:focus-visible {
      outline: 2px solid var(--acc);
      outline-offset: 1px
    }

    .tools input {
      width: auto
    }

    .btn {
      background: var(--acc);
      color: #fff;
      border: 0;
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: 700;
      cursor: pointer
    }

    .btn.ghost {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line)
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 20px
    }

    .top {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px
    }

    .balance {
      background: linear-gradient(135deg, #14213d, #2f4bff);
      color: #fff;
      border: 0
    }

    .balance small {
      opacity: .75
    }

    .big {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: -.03em;
      margin: 6px 0 10px
    }

    .bar {
      height: 8px;
      border-radius: 8px;
      background: rgba(255, 255, 255, .2);
      overflow: hidden
    }

    .bar i {
      display: block;
      height: 100%;
      background: #7dffcf;
      width: 0;
      transition: width .4s
    }

    .stat small {
      color: var(--mut)
    }

    .stat b {
      display: block;
      font-size: 1.5rem;
      margin-top: 6px;
      letter-spacing: -.02em
    }

    .in {
      color: var(--in)
    }

    .out {
      color: var(--out)
    }

    .main {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 16px
    }

    form {
      display: grid;
      gap: 10px
    }

    label {
      font-size: .8rem;
      color: var(--mut);
      font-weight: 500;
      display: grid;
      gap: 4px
    }

    .seg {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--bg);
      border-radius: 10px;
      padding: 4px
    }

    .seg button {
      border: 0;
      background: none;
      padding: 8px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      color: var(--mut)
    }

    .seg button.on.i {
      background: var(--in);
      color: #fff
    }

    .seg button.on.o {
      background: var(--out);
      color: #fff
    }

    .cats {
      margin-top: 16px
    }

    .cat {
      margin-bottom: 12px;
      font-size: .85rem
    }

    .cat div {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px
    }

    .cat span.t {
      height: 6px;
      background: var(--bg);
      border-radius: 6px;
      display: block;
      overflow: hidden
    }

    .cat span.t i {
      display: block;
      height: 100%;
      background: var(--out);
      border-radius: 6px
    }

    .filters {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 8px;
      margin-bottom: 12px
    }

    .list {
      display: grid
    }

    .row {
      display: grid;
      grid-template-columns: 40px 1fr auto 32px;
      gap: 12px;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--line)
    }

    .row:last-child {
      border: 0
    }

    .ico {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 1.1rem;
      background: var(--bg)
    }

    .row b {
      display: block;
      font-size: .92rem
    }

    .row small {
      color: var(--mut)
    }

    .val {
      font-weight: 700;
      white-space: nowrap
    }

    .del {
      border: 0;
      background: none;
      color: var(--mut);
      cursor: pointer;
      font-size: 1.1rem;
      border-radius: 8px;
      padding: 6px
    }

    .del:hover {
      color: var(--out)
    }

    .empty {
      text-align: center;
      color: var(--mut);
      padding: 32px 0
    }

    @media(max-width:860px) {

      .top,
      .main {
        grid-template-columns: 1fr
      }

      .big {
        font-size: 2rem
      }
    }

    @media(prefers-reduced-motion:reduce) {
      * {
        transition: none !important
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <h1>Controle Financeiro</h1>
      <div class="tools">
        <input type="month" id="mes" aria-label="Mês">
        <button class="btn ghost" id="csv">Exportar CSV</button>
      </div>
    </header>

    <section class="top">
      <div class="card balance">
        <small>Saldo do mês</small>
        <div class="big" id="saldo">R$ 0,00</div>
        <div class="bar"><i id="uso"></i></div>
        <small id="usoTxt" style="display:block;margin-top:8px"></small>
      </div>
      <div class="card stat"><small>Receitas</small><b class="in" id="rec">R$ 0,00</b></div>
      <div class="card stat"><small>Despesas</small><b class="out" id="des">R$ 0,00</b></div>
    </section>

    <section class="main">
      <aside>
        <div class="card">
          <h2>Nova transação</h2>
          <form id="f">
            <div class="seg" id="tipo">
              <button type="button" class="on o" data-t="despesa">Despesa</button>
              <button type="button" data-t="receita">Receita</button>
            </div>
            <label>Descrição<input id="desc" required maxlength="60" placeholder="Ex.: Supermercado"></label>
            <label>Valor (R$)<input id="valor" type="number" step="0.01" min="0.01" required placeholder="0,00"></label>
            <label>Categoria<select id="cat"></select></label>
            <label>Data<input id="data" type="date" required></label>
            <button class="btn" type="submit">Adicionar transação</button>
          </form>
        </div>
        <div class="card cats">
          <h2>Despesas por categoria</h2>
          <div id="cats"></div>
        </div>
      </aside>

      <div class="card">
        <h2>Transações</h2>
        <div class="filters">
          <input id="busca" placeholder="Buscar por descrição" aria-label="Buscar">
          <select id="ftipo" aria-label="Filtrar tipo">
            <option value="">Todas</option>
            <option value="receita">Receitas</option>
            <option value="despesa">Despesas</option>
          </select>
        </div>
        <div class="list" id="lista"></div>
      </div>
    </section>
  </div>

  <script>
    const CATS = {
      despesa: { 'Moradia': '🏠', 'Alimentação': '🛒', 'Transporte': '🚗', 'Saúde': '💊', 'Lazer': '🎬', 'Educação': '📚', 'Contas': '💡', 'Outros': '📦' },
      receita: { 'Salário': '💼', 'Freelance': '🧑‍💻', 'Investimentos': '📈', 'Outros': '💰' }
    };
    const $ = id => document.getElementById(id);
    const brl = v => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    let tipo = 'despesa', dados = [];
    try { dados = JSON.parse(localStorage.getItem('fin_dados') || '[]') } catch (e) { }
    const salvar = () => { try { localStorage.setItem('fin_dados', JSON.stringify(dados)) } catch (e) { } };
    const hoje = new Date().toISOString().slice(0, 10);
    $('mes').value = hoje.slice(0, 7); $('data').value = hoje;

    function montaCats() {
      $('cat').innerHTML = Object.keys(CATS[tipo]).map(c => `<option>${c}</option>`).join('');
    }
    $('tipo').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      tipo = b.dataset.t;
      [...$('tipo').children].forEach(x => x.className = x === b ? 'on ' + (tipo === 'receita' ? 'i' : 'o') : '');
      montaCats();
    });

    $('f').addEventListener('submit', e => {
      e.preventDefault();
      dados.push({ id: Date.now(), tipo, desc: $('desc').value.trim(), valor: parseFloat($('valor').value), cat: $('cat').value, data: $('data').value });
      salvar(); $('desc').value = ''; $('valor').value = '';
      $('mes').value = $('data').value.slice(0, 7);
      render();
    });

    function esc(s) { return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])) }

    function render() {
      const mes = $('mes').value, q = $('busca').value.toLowerCase(), ft = $('ftipo').value;
      const doMes = dados.filter(d => d.data.startsWith(mes));
      const rec = doMes.filter(d => d.tipo === 'receita').reduce((s, d) => s + d.valor, 0);
      const des = doMes.filter(d => d.tipo === 'despesa').reduce((s, d) => s + d.valor, 0);
      $('rec').textContent = brl(rec); $('des').textContent = brl(des); $('saldo').textContent = brl(rec - des);
      const pct = rec > 0 ? Math.min(100, des / rec * 100) : (des > 0 ? 100 : 0);
      $('uso').style.width = pct + '%';
      $('usoTxt').textContent = rec > 0 ? `${pct.toFixed(0)}% da receita já foi gasta` : 'Registre receitas para acompanhar o uso';

      const porCat = {};
      doMes.filter(d => d.tipo === 'despesa').forEach(d => porCat[d.cat] = (porCat[d.cat] || 0) + d.valor);
      const ord = Object.entries(porCat).sort((a, b) => b[1] - a[1]);
      $('cats').innerHTML = ord.length ? ord.map(([c, v]) => `<div class="cat"><div><span>${CATS.despesa[c] || '📦'} ${esc(c)}</span><b>${brl(v)}</b></div><span class="t"><i style="width:${v / des * 100}%"></i></span></div>`).join('')
        : '<p class="empty">Nenhuma despesa neste mês.</p>';

      const lista = doMes.filter(d => (!ft || d.tipo === ft) && d.desc.toLowerCase().includes(q)).sort((a, b) => b.data.localeCompare(a.data) || b.id - a.id);
      $('lista').innerHTML = lista.length ? lista.map(d => {
        const r = d.tipo === 'receita', [y, m, dd] = d.data.split('-');
        return `<div class="row"><div class="ico">${CATS[d.tipo][d.cat] || '📦'}</div>
      <div><b>${esc(d.desc)}</b><small>${esc(d.cat)} · ${dd}/${m}/${y}</small></div>
      <span class="val ${r ? 'in' : 'out'}">${r ? '+' : '−'} ${brl(d.valor)}</span>
      <button class="del" data-id="${d.id}" aria-label="Excluir ${esc(d.desc)}">✕</button></div>`;
      }).join('') : '<p class="empty">Nenhuma transação encontrada. Adicione a primeira ao lado.</p>';
    }

    $('lista').addEventListener('click', e => {
      const b = e.target.closest('.del'); if (!b) return;
      if (confirm('Excluir esta transação?')) { dados = dados.filter(d => d.id != b.dataset.id); salvar(); render(); }
    });
    ['mes', 'busca', 'ftipo'].forEach(i => $(i).addEventListener('input', render));

    $('csv').addEventListener('click', () => {
      const mes = $('mes').value;
      const linhas = [['Data', 'Tipo', 'Categoria', 'Descrição', 'Valor']].concat(
        dados.filter(d => d.data.startsWith(mes)).map(d => [d.data, d.tipo, d.cat, '"' + d.desc.replace(/"/g, '""') + '"', d.valor.toFixed(2).replace('.', ',')]));
      const blob = new Blob(['\ufeff' + linhas.map(l => l.join(';')).join('\n')], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `financas-${mes}.csv`; a.click();
    });

    montaCats(); render();
  </script>
</body>

</html>
